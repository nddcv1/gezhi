name: android

permissions:
  contents: write

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  android:
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Prepare Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -name sdkmanager -type f | head -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_ROOT"; exit 1
          fi
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Decode keystore
        env:
          KS_B64: ${{ secrets.GEZHI_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            printf '%s' "$KS_B64" | base64 -d > android/app/gezhi-release.keystore
            echo "keystore ready"
          else
            echo "no keystore secret, falling back to debug signing"
          fi
      - name: Probe Maven repositories
        run: |
          for url in \
            "https://dl.google.com/dl/android/maven2/com/android/tools/build/gradle/8.7.2/gradle-8.7.2.pom" \
            "https://repo.maven.apache.org/maven2/org/jetbrains/kotlin/kotlin-stdlib-jdk8/1.9.20/kotlin-stdlib-jdk8-1.9.20.pom" \
            "https://repo1.maven.org/maven2/org/jetbrains/kotlin/kotlin-stdlib-jdk8/1.9.20/kotlin-stdlib-jdk8-1.9.20.pom"; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 30 "$url" || echo "curl-failed")
            echo "$code  $url"
          done
      - name: Build APK
        working-directory: android
        env:
          GEZHI_KEYSTORE_PATH: ${{ github.workspace }}/android/app/gezhi-release.keystore
          GEZHI_KEYSTORE_PASSWORD: ${{ secrets.GEZHI_KEYSTORE_PASSWORD }}
          GEZHI_KEY_ALIAS: ${{ secrets.GEZHI_KEY_ALIAS }}
          GEZHI_KEY_PASSWORD: ${{ secrets.GEZHI_KEY_PASSWORD }}
          GEZHI_VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace || ./gradlew assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: gezhi-apk
          path: android/app/build/outputs/apk/**/*.apk
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/**/*.apk
